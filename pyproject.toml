[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulkhead"
version = "0.1.0"
description = "Session-aware firewall for AI coding agents, built on the Clocked API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "requests>=2.31", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
bulkhead = "bulkhead.cli:main"

[tool.setuptools]
packages = ["bulkhead"]

[tool.setuptools.package-data]
bulkhead = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
